# CI of the landing: the legal pages (tools/build-legal.js) and the Arabic page (tools/build-ar.js) are generated from their
# sources. This fails when a generated file is out of date, or when a legal text still has a placeholder or lacks a required
# statement. No secrets, no network. On a push to main the site is published to GitHub Pages by the `deploy` job, and only when
# the checks are green (Settings → Pages → Source must be "GitHub Actions"). Only the files listed in tools/build-site.js are
# published; the generated pages are published as committed (nothing is generated in the deploy).
name: CI

on:
  push:
  pull_request:

# never cancel a run on main: a running run (and its deploy) is finished and the next one waits; on other branches and PRs a newer
# run replaces the older one. (This is the whole run: the separate `pages` group of the deploy job cannot protect it.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  generated-pages:
    name: Generated pages are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Terms of Service and Privacy Policy (EN + AR)
        run: node tools/build-legal.js --check
      - name: Arabic landing page
        run: |
          node tools/build-ar.js
          git diff --exit-code -- ar/index.html tools/landing-ar-texts.md || { echo "::error::ar/index.html is out of date: run node tools/build-ar.js and commit"; exit 1; }
      - name: Site tests and the Pages artifact (dry run of the deploy)
        run: |
          node test/build-site.test.js
          node tools/build-site.js _site

      # only on a pull request: the same upload the deploy job does, so a new version of the action is tried before the merge
      # (the deploy steps themselves run on main only); nothing is published, the artifact is kept for one day
      - name: Try the Pages artifact upload (pull requests only, nothing is deployed)
        if: github.event_name == 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: generated-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # a separate group: a newer deploy waits for the running one instead of cancelling it half way
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the site folder (only the site files, CNAME included)
        run: node tools/build-site.js _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
